[project]
name = "secondchair"
version = "0.1.0"
description = "Real-time AI bass accompanist: symbolic bassline generation from chords and meter."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib",
    "miditok",  # reference oracle only; secondchair has its own tokenizer
    "numpy",
    "openpyxl>=3.1.5",
    "pandas",
    "symusic",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
